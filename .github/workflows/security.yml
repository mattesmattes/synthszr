name: Security Scan

# SEC-012: every job installs from the same pnpm graph (one lockfile, pinned
# package manager, Node 24 to match engines.node), and every gate below is
# blocking. Only the artifact-producing report steps may fail softly - the
# step that decides pass/fail never does.
#
# All third-party actions are pinned to a full commit SHA rather than a
# mutable tag: a tag can be repointed at new code by whoever owns the action,
# which makes `@v4`/`@main` an unreviewed dependency running with repo
# credentials. Dependabot keeps the pins current.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sunday at midnight
    - cron: '0 0 * * 0'

jobs:
  # Dependency vulnerability scanning
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking. Documented exceptions live in package.json under
      # pnpm.auditConfig.ignoreGhsas with a written rationale next to them;
      # the audit level itself is never lowered.
      - name: Block Critical and High advisories
        run: pnpm audit --audit-level=high

      - name: Run pnpm audit (report)
        if: always()
        run: pnpm audit --json > pnpm-audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pnpm-audit-report
          path: pnpm-audit-report.json
          retention-days: 30

  # Secret scanning with TruffleHog
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified

  # CodeQL analysis for JavaScript/TypeScript
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@a2983b8bed1923f44751c5c43237f479442827b3 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          category: "/language:javascript-typescript"

  # Semgrep for custom security rules
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      # semgrep/semgrep:1.172.0 resolved to its manifest digest
      image: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Blocking on ERROR-severity findings only, so the gate stays actionable.
      #
      # `--config auto` was removed: it resolves its ruleset from the Semgrep
      # registry and needs SEMGREP_APP_TOKEN, so without one it exits 7 after
      # ~4 seconds without scanning anything. Combined with the previous
      # `|| true` that meant this job reported success while never running.
      # The project rules in .semgrep.yml ship with the repo and always load;
      # generic coverage comes from the CodeQL job above.
      - name: Run Semgrep
        run: semgrep scan --error --severity ERROR --metrics=off --config .semgrep.yml --json -o semgrep-results.json

      # A rule whose pattern does not parse is reported inside the JSON and
      # otherwise ignored - the scan still exits 0, so a broken rule looks
      # exactly like a passing one. Fail explicitly instead.
      - name: Fail on rules that could not be loaded
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('semgrep-results.json'))
          broken = [e for e in data.get('errors', []) if e.get('type') == 'Rule parse error']
          for e in broken:
              print('Unloadable rule:', e.get('rule_id'))
              print(e.get('message', '')[:400])
          sys.exit(1 if broken else 0)
          "

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  # TypeScript type checking
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm typecheck

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm exec vitest run tests/lib/
        env:
          NODE_ENV: test
